name: Vercel Deployment

on:
  push:
    branches:
      - dev-space
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-dev-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Trigger Vercel deploy hook
        run: curl --fail --request POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
